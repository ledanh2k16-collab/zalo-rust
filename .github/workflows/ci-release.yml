name: CI & Cross-Platform Release (.deb / .rpm / .AppImage / .tar.gz / .exe / .dmg)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (optional; must match Cargo.toml when provided)"
        required: false
        type: string
      publish:
        description: "Publish GitHub Release from this manual run"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  # 0. Single source of truth for the release version. Every build job consumes this output.
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve version and validate release tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "lmd") | .version')
          test -n "$version"

          if [[ -n "${INPUT_VERSION:-}" ]]; then
            clean_input="${INPUT_VERSION#v}"
            if [[ "$clean_input" != "$version" ]]; then
              echo "::error::workflow_dispatch version '$INPUT_VERSION' does not match Cargo.toml version '$version'"
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$version" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
              exit 1
            fi
            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag commit $GITHUB_SHA is not on main"
              exit 1
            fi
          fi

  # Fast PR and push test suite without building all 9 OS release installers
  test:
    name: Cargo Test Suite (Linux x86_64)
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libasound2-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libgtk-3-dev
      - name: Run test suite
        run: cargo test --locked

  # 1. Universal Linux packages built on Ubuntu 22.04 LTS (glibc 2.35, statically linked libopus + sqlite3 + rustls)
  # Produces: .deb (Debian/Ubuntu/Mint/Kali/Pop!_OS), .rpm (Fedora/RHEL/Rocky/Alma/openSUSE), .AppImage (all distros), .tar.gz (Arch/Void/Gentoo/any distro)
  linux-packages:
    name: Linux Multi-Format (.deb / .rpm / .AppImage / .tar.gz)
    needs: prepare
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full-package')
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build & packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libasound2-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libgtk-3-dev rpm file desktop-file-utils libfuse2
      - name: Run test suite
        run: cargo test --locked
      - name: Build release binary (static libopus & sqlite3)
        run: |
          cargo build --release --locked --bin lmd
          strip target/release/lmd
          chmod +x packaging/linux/install.sh packaging/linux/uninstall.sh
      - name: Package .deb (Debian / Ubuntu 22.04+ / Linux Mint / Kali / Pop!_OS / Zorin)
        run: |
          mkdir -p dist pkg_deb/DEBIAN pkg_deb/usr/bin pkg_deb/usr/share/applications pkg_deb/usr/share/icons/hicolor/256x256/apps
          cp target/release/lmd pkg_deb/usr/bin/lmd
          cp packaging/linux/lmd.desktop pkg_deb/usr/share/applications/lmd.desktop
          cp src/assets/app_icon.png pkg_deb/usr/share/icons/hicolor/256x256/apps/lmd.png
          cat > pkg_deb/DEBIAN/control << EOF
          Package: lmd
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: libc6, libasound2 | libasound2t64, libx11-6, libxcb1, libxkbcommon0, libgl1
          Recommends: ffmpeg, zenity, xclip, wl-clipboard, fonts-noto-core
          Maintainer: TIPC1110 <tienichpc1110@gmail.com>
          Description: Lightweight native Zalo PC client written in Rust
          EOF
          dpkg-deb --build --root-owner-group pkg_deb "dist/lmd_${VERSION}_amd64.deb"
      - name: Package .rpm (Fedora / RHEL / Rocky / AlmaLinux / CentOS / openSUSE)
        run: |
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cat > rpmbuild/SPECS/lmd.spec << 'EOF'
          Name:           lmd
          Version:        @VERSION@
          Release:        1
          Summary:        Native Zalo Desktop Client written in Rust
          License:        MIT OR Apache-2.0
          URL:            https://github.com/ledanh2k16-collab/zalo-rust
          BuildArch:      x86_64
          AutoReqProv:    no
          Requires:       alsa-lib, libX11, libxcb, libxkbcommon

          %description
          Lightweight native Zalo Desktop Client written in Rust (eframe/egui + ratatui).

          %install
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/share/applications
          mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps
          install -m 755 %{_topdir}/../target/release/lmd %{buildroot}/usr/bin/lmd
          install -m 644 %{_topdir}/../packaging/linux/lmd.desktop %{buildroot}/usr/share/applications/lmd.desktop
          install -m 644 %{_topdir}/../src/assets/app_icon.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/lmd.png

          %files
          /usr/bin/lmd
          /usr/share/applications/lmd.desktop
          /usr/share/icons/hicolor/256x256/apps/lmd.png
          EOF
          sed -i "s/@VERSION@/${VERSION}/" rpmbuild/SPECS/lmd.spec
          rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/lmd.spec
          cp rpmbuild/RPMS/x86_64/*.rpm "dist/lmd-${VERSION}-1.x86_64.rpm"
      - name: Package .AppImage (Universal single-file executable for all Linux distros)
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/release/lmd AppDir/usr/bin/lmd
          cp packaging/linux/lmd.desktop AppDir/lmd.desktop
          cp packaging/linux/lmd.desktop AppDir/usr/share/applications/lmd.desktop
          cp src/assets/app_icon.png AppDir/lmd.png
          cp src/assets/app_icon.png AppDir/.DirIcon
          cp src/assets/app_icon.png AppDir/usr/share/icons/hicolor/256x256/apps/lmd.png
          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          if [ $# -eq 0 ]; then
              exec "${HERE}/usr/bin/lmd" --gui
          else
              exec "${HERE}/usr/bin/lmd" "$@"
          fi
          EOF
          chmod +x AppDir/AppRun
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "dist/lmd-${VERSION}-x86_64.AppImage"
          chmod +x "dist/lmd-${VERSION}-x86_64.AppImage"
      - name: Package portable .tar.gz with universal install.sh (Arch / Manjaro / Gentoo / Void / any Linux)
        run: |
          STAGE="lmd-${VERSION}-linux-x86_64"
          mkdir -p "$STAGE"
          cp target/release/lmd "$STAGE/lmd"
          cp packaging/linux/install.sh "$STAGE/install.sh"
          cp packaging/linux/uninstall.sh "$STAGE/uninstall.sh"
          cp packaging/linux/lmd.desktop "$STAGE/lmd.desktop"
          cp src/assets/app_icon.png "$STAGE/lmd.png"
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGE/"
          chmod +x "$STAGE/lmd" "$STAGE/install.sh" "$STAGE/uninstall.sh"
          tar -czf "dist/${STAGE}.tar.gz" "$STAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: lmd-linux-packages
          path: dist/*

  # 2. Legacy Linux build on Debian 11 Bullseye (glibc 2.31) for older distros (Ubuntu 20.04, Debian 11, Mint 20, RHEL/Rocky 8.x/9.x)
  linux-legacy-glibc231:
    name: Linux Legacy glibc 2.31 (Debian 11 / Ubuntu 20.04+)
    needs: prepare
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full-package')
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    container:
      image: rust:bullseye
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies & update Rust stable (Debian 11 Bullseye)
        run: |
          sed -i '/bullseye-security/d' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          apt-get update
          apt-get install -y --no-upgrade build-essential cmake pkg-config \
            libasound2-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libgtk-3-dev
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bullseye-glibc231
      - name: Build legacy release binary & .deb + .tar.gz
        run: |
          cargo build --release --locked --bin lmd
          strip target/release/lmd
          chmod +x packaging/linux/install.sh packaging/linux/uninstall.sh
          mkdir -p dist pkg_deb/DEBIAN pkg_deb/usr/bin pkg_deb/usr/share/applications pkg_deb/usr/share/icons/hicolor/256x256/apps
          cp target/release/lmd pkg_deb/usr/bin/lmd
          cp packaging/linux/lmd.desktop pkg_deb/usr/share/applications/lmd.desktop
          cp src/assets/app_icon.png pkg_deb/usr/share/icons/hicolor/256x256/apps/lmd.png
          cat > pkg_deb/DEBIAN/control << EOF
          Package: lmd
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: libc6 (>= 2.31), libasound2 | libasound2t64
          Recommends: ffmpeg, zenity, xclip, wl-clipboard, fonts-noto-core
          Maintainer: TIPC1110 <tienichpc1110@gmail.com>
          Description: Lightweight native Zalo PC client written in Rust (glibc 2.31+ compatible)
          EOF
          dpkg-deb --build --root-owner-group pkg_deb "dist/lmd_${VERSION}_legacy_glibc2.31_amd64.deb"

          STAGE="lmd-${VERSION}-linux-x86_64-legacy-glibc2.31"
          mkdir -p "$STAGE"
          cp target/release/lmd "$STAGE/lmd"
          cp packaging/linux/install.sh "$STAGE/install.sh"
          cp packaging/linux/uninstall.sh "$STAGE/uninstall.sh"
          cp packaging/linux/lmd.desktop "$STAGE/lmd.desktop"
          cp src/assets/app_icon.png "$STAGE/lmd.png"
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGE/"
          chmod +x "$STAGE/lmd" "$STAGE/install.sh" "$STAGE/uninstall.sh"
          tar -czf "dist/${STAGE}.tar.gz" "$STAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: lmd-linux-legacy
          path: dist/*

  windows-exe:
    name: Windows (MSVC x86_64 + .exe)
    needs: prepare
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full-package')
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run test suite
        run: cargo test --locked
      - name: Download ffmpeg.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target\release | Out-Null
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
            Write-Host "Copying preinstalled ffmpeg from $((Get-Command ffmpeg).Source)..."
            Copy-Item (Get-Command ffmpeg).Source target\release\ffmpeg.exe -Force
          } else {
            Write-Host "Downloading ffmpeg from BtbN FFmpeg-Builds releases..."
            curl.exe -fsSL -o target\release\ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
            Expand-Archive -Path target\release\ffmpeg.zip -DestinationPath target\release\ffmpeg-extract -Force
            $bin = Get-ChildItem -Path target\release\ffmpeg-extract -Filter ffmpeg.exe -Recurse | Select-Object -First 1
            if ($bin) {
              Move-Item $bin.FullName target\release\ffmpeg.exe -Force
            }
            Remove-Item -Recurse -Force target\release\ffmpeg.zip, target\release\ffmpeg-extract -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path target\release\ffmpeg.exe)) {
            Write-Error "ffmpeg.exe not found or downloaded"
            exit 1
          }
      - name: Build release binary & installer
        shell: pwsh
        run: |
          cargo build --release --locked --bin lmd
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\lmd.exe "dist\lmd-$($env:VERSION)-portable-windows-x86_64.exe" -Force
          Copy-Item target\release\lmd.exe "dist\tezadis-$($env:VERSION)-portable-windows-x86_64.exe" -Force
          Compress-Archive -Path "dist\lmd-$($env:VERSION)-portable-windows-x86_64.exe","README.md","LICENSE-MIT","LICENSE-APACHE" -DestinationPath "dist\lmd-$($env:VERSION)-portable-windows-x86_64.zip" -Force
          
          # Locate ISCC.exe on GitHub Actions Windows runner or install via Chocolatey
          $iscc = if (Get-Command iscc -ErrorAction SilentlyContinue) {
            "iscc"
          } elseif (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") {
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          } elseif (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe") {
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          } else {
            Write-Host "Installing Inno Setup via Chocolatey..."
            choco install innosetup -y --no-progress
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          Write-Host "Compiling Windows installer with: $iscc"
          & $iscc "/DMyAppVersion=$($env:VERSION)" packaging\windows\installer.iss

          # Handle both dist\setup.exe and dist\lmd-setup-windows-x86_64.exe outputs safely
          if (Test-Path dist\setup.exe) {
            Copy-Item dist\setup.exe "dist\tezadis-$($env:VERSION)-setup-windows-x86_64.exe" -Force
            Move-Item dist\setup.exe "dist\lmd-$($env:VERSION)-setup-windows-x86_64.exe" -Force
          } elseif (Test-Path dist\lmd-setup-windows-x86_64.exe) {
            Copy-Item dist\lmd-setup-windows-x86_64.exe "dist\tezadis-$($env:VERSION)-setup-windows-x86_64.exe" -Force
            Move-Item dist\lmd-setup-windows-x86_64.exe "dist\lmd-$($env:VERSION)-setup-windows-x86_64.exe" -Force
          } else {
            Write-Error "Inno Setup failed to generate an installer executable in dist/"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: lmd-windows-exe
          path: |
            dist/*.exe
            dist/*.zip

  macos-dmg:
    name: macOS (Apple Silicon arm64 + Intel x86_64 + Universal .dmg)
    needs: prepare
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full-package')
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      LIBOPUS_STATIC: "1"
      LIBOPUS_NO_PKG: "1"
      OPUS_STATIC: "1"
      OPUS_NO_PKG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Ensure CMake is available (without Homebrew dynamic libopus)
        run: |
          command -v cmake >/dev/null 2>&1 || brew install cmake
          cmake --version
      - name: Run test suite
        run: |
          CMAKE_TOOLCHAIN_FILE="$PWD/packaging/macos/toolchain-arm64.cmake" \
            cargo test --locked
      - name: Build release binaries (Apple Silicon arm64 + Intel x86_64 + Universal) & .dmg packages
        run: |
          set -euo pipefail
          VER="${VERSION:-0.0.3}"

          echo "=== [1/4] Building Apple Silicon (aarch64-apple-darwin) ==="
          CMAKE_TOOLCHAIN_FILE="$PWD/packaging/macos/toolchain-arm64.cmake" \
            cargo build --release --locked --target aarch64-apple-darwin --bin lmd

          echo "=== [2/4] Building Mac Intel (x86_64-apple-darwin) ==="
          CMAKE_TOOLCHAIN_FILE="$PWD/packaging/macos/toolchain-x86_64.cmake" \
            cargo build --release --locked --target x86_64-apple-darwin --bin lmd

          echo "=== [3/4] Creating Universal Binary (arm64 + x86_64) via lipo ==="
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/lmd \
            target/x86_64-apple-darwin/release/lmd \
            -output target/universal-apple-darwin/release/lmd
          lipo -info target/universal-apple-darwin/release/lmd

          echo "=== Verifying zero Homebrew dynamic library dependencies ==="
          otool -L target/aarch64-apple-darwin/release/lmd
          otool -L target/x86_64-apple-darwin/release/lmd
          if otool -L target/universal-apple-darwin/release/lmd | grep -E '/opt/homebrew|/usr/local'; then
            echo "ERROR: Binary still links against Homebrew dylib!"
            exit 1
          fi

          echo "=== Generating AppIcon.icns from src/assets/app_icon.png ==="
          mkdir -p build_icon/AppIcon.iconset
          for sz in 16 32 128 256 512; do
            sips -s format png -z $sz $sz src/assets/app_icon.png --out "build_icon/AppIcon.iconset/icon_${sz}x${sz}.png" >/dev/null
            sz2=$((sz * 2))
            sips -s format png -z $sz2 $sz2 src/assets/app_icon.png --out "build_icon/AppIcon.iconset/icon_${sz}x${sz}@2x.png" >/dev/null
          done
          iconutil -c icns build_icon/AppIcon.iconset -o build_icon/AppIcon.icns || true

          mkdir -p dist

          package_dmg() {
            local bin_path="$1"
            local dmg_out="$2"
            local vol_name="$3"
            local stage_dir
            stage_dir="$(mktemp -d)"
            mkdir -p "$stage_dir/lmd.app/Contents/MacOS"
            mkdir -p "$stage_dir/lmd.app/Contents/Resources"
            cp "$bin_path" "$stage_dir/lmd.app/Contents/MacOS/lmd"
            chmod +x "$stage_dir/lmd.app/Contents/MacOS/lmd"
            case "$bin_path" in
              target/aarch64-*) swift_targets="arm64-apple-macosx11.0" ;;
              target/x86_64-*) swift_targets="x86_64-apple-macosx11.0" ;;
              *) swift_targets="arm64-apple-macosx11.0,x86_64-apple-macosx11.0" ;;
            esac
            # Public builds deliberately omit externally licensed codec JS/WASM.
            env -u HISTORY_CODEC_ASSETS SWIFT_TARGETS="$swift_targets" bash native/macos/build-native-helpers.sh "$stage_dir/lmd.app"
            helper_arches="$(lipo -archs "$bin_path" | xargs | tr ' ' ',')"
            python3 packaging/macos/validate-native-bundle.py "$stage_dir/lmd.app" --arches "$helper_arches"
            cp packaging/macos/Info.plist "$stage_dir/lmd.app/Contents/Info.plist"
            plutil -replace CFBundleShortVersionString -string "$VER" "$stage_dir/lmd.app/Contents/Info.plist"
            printf 'APPL????' > "$stage_dir/lmd.app/Contents/PkgInfo"
            if [ -f build_icon/AppIcon.icns ]; then
              cp build_icon/AppIcon.icns "$stage_dir/lmd.app/Contents/Resources/AppIcon.icns"
            fi
            xattr -cr "$stage_dir/lmd.app" || true
            codesign --force --sign - "$stage_dir/lmd.app/Contents/Helpers/DailyNotifier.app"
            codesign --force --deep --sign - "$stage_dir/lmd.app"
            codesign --verify --deep --strict "$stage_dir/lmd.app"
            ln -s /Applications "$stage_dir/Applications"

            for attempt in 1 2 3 4 5; do
              if hdiutil create -volname "$vol_name" -srcfolder "$stage_dir" -ov -fs HFS+ -format UDZO "$dmg_out"; then
                break
              fi
              echo "hdiutil attempt $attempt failed, retrying in 3s..."
              sleep 3
            done
            rm -rf "$stage_dir"
            test -f "$dmg_out"
          }

          echo "=== [4/4] Packaging .dmg installers (Apple Silicon, Intel, Universal) ==="
          package_dmg "target/aarch64-apple-darwin/release/lmd" "dist/lmd-${VER}-macos-arm64.dmg" "lmd (Apple Silicon)"
          package_dmg "target/x86_64-apple-darwin/release/lmd" "dist/lmd-${VER}-macos-x86_64.dmg" "lmd (Intel)"
          package_dmg "target/universal-apple-darwin/release/lmd" "dist/lmd-${VER}-macos.dmg" "lmd"
          python3 tests/native_packaging.py
          ls -lh dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: lmd-macos-dmg
          path: dist/*.dmg
  release:
    name: Publish GitHub Release
    needs: [prepare, linux-packages, linux-legacy-glibc231, windows-exe, macos-dmg]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)) && needs.prepare.result == 'success' && needs.linux-packages.result == 'success' && needs.linux-legacy-glibc231.result == 'success' && needs.windows-exe.result == 'success' && needs.macos-dmg.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt & latest.json update manifest
        run: |
          set -euo pipefail
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          VER="${VERSION}"
          TAG="${TAG_NAME}"
          python3 - << 'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          ver = os.environ["VERSION"]
          tag = os.environ["TAG_NAME"]
          repo = "https://github.com/ledanh2k16-collab/zalo-rust"
          assets = []
          for line in Path("SHA256SUMS.txt").read_text().splitlines():
              parts = line.strip().split(None, 1)
              if len(parts) != 2:
                  continue
              sha256_hex, name = parts[0], parts[1].lstrip("*")
              p = Path(name)
              if not p.is_file():
                  continue
              assets.append({
                  "name": name,
                  "sha256": sha256_hex,
                  "size": p.stat().st_size,
                  "browser_download_url": f"{repo}/releases/download/{tag}/{name}",
              })
          manifest = {
              "schema_version": 1,
              "version": ver,
              "tag_name": tag,
              "published_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "repository": repo,
              "release_url": f"{repo}/releases/tag/{tag}",
              "assets": assets,
          }
          Path("latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          cat SHA256SUMS.txt
          cat latest.json
      # Install instructions live in docs/CAI_DAT.md. The release body includes
      # concise Vietnamese highlights so the in-app GitHub Releases API updater
      # renders exact bug fixes and feature updates directly inside lmd.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: lmd ${{ needs.prepare.outputs.tag_name }} — Sửa lỗi gõ tiếng Việt Telex macOS (#71), Xem ảnh trực tiếp (#72), Tự động đồng bộ SĐT (#73) & Tải file giữ nguyên tên gốc (#74)
          files: release_assets/*
          generate_release_notes: true
          body: |
            > **Hướng dẫn cài đặt:** [docs/CAI_DAT.md](https://github.com/ledanh2k16-collab/zalo-rust/blob/main/docs/CAI_DAT.md) · **Tính năng & giới hạn:** [docs/TINH_NANG.md](https://github.com/ledanh2k16-collab/zalo-rust/blob/main/docs/TINH_NANG.md) · **Trang chủ:** https://github.com/ledanh2k16-collab/zalo-rust
            >
            > Chọn đúng gói trong mục **Assets** bên dưới cho hệ điều hành của bạn (hỗ trợ Linux `.deb`/`.rpm`/`.AppImage`/`.tar.gz`, Windows `.exe`, và macOS `.dmg` cho cả **Apple Silicon M1/M2/M3/M4 `arm64`**, **Mac Intel `x86_64`** & **Universal**).

            ### 🐛 Đã sửa lỗi trong v0.0.7 (Bug Fixes)
            - **Sửa lỗi gõ tiếng Việt Telex trên macOS bị nuốt dấu cách & lỗi phím Enter ([#71](https://github.com/ledanh2k16-collab/zalo-rust/issues/71)):** Bảo toàn ký tự khoảng trắng (`" "`) trong sự kiện `Event::Ime(ImeEvent::Commit(" "))` của macOS NSTextInputClient/egui trước đây bị lọc nhầm bởi `.is_empty()`, đồng thời gắn cờ `ime_preedit_active` để phím `Enter` chỉ xác nhận từ đang gõ dấu thay vì gửi tin nhắn sớm.
            - **Hiển thị trực tiếp ảnh trong hội thoại & Trình xem ảnh tích hợp ([#72](https://github.com/ledanh2k16-collab/zalo-rust/issues/72)):** Phóng to khung hiển thị ảnh trực tiếp trong bong bóng chat lên tối đa `340x320`, tự động ẩn chuỗi URL CDN thô (`https://...zdn.vn/...`) khi đã có ảnh đính kèm, và chuyển toàn bộ thao tác bấm vào ảnh hoặc liên kết ảnh sang mở `ImageViewerModal` ngay trong ứng dụng (hỗ trợ phóng to/thu nhỏ, sao chép ảnh vào clipboard và lưu về máy).
            - **Tự động kích hoạt đồng bộ tin nhắn từ điện thoại ngay khi đăng nhập ([#73](https://github.com/ledanh2k16-collab/zalo-rust/issues/73)):** Tự động khởi chạy đồng bộ lịch sử đám mây kèm gửi gói yêu cầu WebSocket `cmd 12000` & `cmd 12888` tới điện thoại ngay sau khi đăng nhập QR/Mật khẩu hoặc khôi phục phiên mà không cần bấm nút thủ công.
            - **Tải tệp đính kèm trực tiếp & giữ nguyên tên file gốc của người gửi ([#74](https://github.com/ledanh2k16-collab/zalo-rust/issues/74)):** Sửa thứ tự trích xuất tên tệp trong `parse_chat_message` (`src/chat.rs`) ưu tiên trường `title` trước `href` để không bao giờ lấy nhầm đường dẫn endpoint `renewMedia.doc` của Zalo CDN, đồng thời tải trực tiếp tệp về thư mục `Downloads` với đúng tên gốc của người gửi thay vì mở trình duyệt ngoài.

            ### ✨ Tính năng nổi bật từ v0.0.6 & v0.0.5 (Recent Highlights)
            - **Trang Danh bạ chuẩn Zalo PC & Gói nhãn dán động "Mèo Ami Bụng Bự (GIF)":** Hợp nhất mục Danh bạ với 4 phân mục, gom nhóm `A–Z`, hỗ trợ hiển thị văn bản định dạng giàu (Markdown & Zalo RTF `textProperties`), đồng bộ tắt thông báo hai chiều ([#67](https://github.com/ledanh2k16-collab/zalo-rust/issues/67)) và đa tài khoản / Proxy ([#64](https://github.com/ledanh2k16-collab/zalo-rust/issues/64)).
            - **Tự động thông báo & cập nhật trực tiếp qua GitHub Releases API:** Tự động kiểm tra bản mới qua `https://api.github.com/repos/ledanh2k16-collab/zalo-rust/releases/latest` khi mở ứng dụng và định kỳ mỗi 30 phút, gửi thông báo hệ điều hành, hiển thị thanh banner cùng hộp thoại chi tiết những gì đã sửa/cập nhật và nút **Cập nhật tự động ngay** (xác thực `SHA256SUMS.txt`).
            - **Hẹn giờ gửi tin nhắn ([#38](https://github.com/ledanh2k16-collab/zalo-rust/issues/38)), REST API / MCP Server / Auto-Reply ([#35](https://github.com/ledanh2k16-collab/zalo-rust/issues/35)), Sửa lỗi trùng tên Zalo ([#63](https://github.com/ledanh2k16-collab/zalo-rust/issues/63)) & Failover đa máy chủ ([#27](https://github.com/ledanh2k16-collab/zalo-rust/issues/27)).**
